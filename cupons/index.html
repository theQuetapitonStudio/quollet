<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quewkyo - Redeem</title>
    <style>
        body {
            text-align: center;
            font-family: sans-serif;
            background-color: black;
            color: white;
        }
        input {
            padding: 2.5%;
        }
    </style>
</head>
<body>
    <h1>Quewkyo - Redeem codes</h1>
    <p>Redeem codes during our livestreams! Youtube: @Quetadys.audios</p>
    <input type="text" id="codeinput" placeholder="Redeem code"><br><br>
    <input type="text" id="usernameinput" placeholder="Your username"><br><br>
    <button id="confirmbtn">Confirm</button>

    <script type="module">
        
const API = Math.floor(Math.random() * 2) > 0
    ? "https://cjccmeaosxnauhzeleuj.supabase.co/functions/v1/quewkyo-weker2"
    : "https://cjccmeaosxnauhzeleuj.supabase.co/functions/v1/quewkyo";

async function api_req(param) {
    try {
        const response = await fetch(API, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(param)
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        return await response.json();

    } catch (error) {
        console.error("WEKER ERROR:", error);
        return {
            success: false,
            erro: "Falha na comunicação com os servidores."
        };
    }
}

document.getElementById("confirmbtn").addEventListener("click", async () => {
    const btn = document.getElementById("confirmbtn");
    btn.disabled = true;

    try {
        const data = await api_req({
            action: "redeem",
            code: document.getElementById("codeinput").value.trim(),
            username: document.getElementById("usernameinput").value.trim()
        });

        if (!data || data.success !== true) {
            alert("ERRO: " + (data?.erro || "Falha desconhecida."));
            return;
        }

        alert("CÓDIGO RESGATADO COM SUCESSO!");

    } finally {
        btn.disabled = false;
    }
});

    </script>
</body>
</html>
