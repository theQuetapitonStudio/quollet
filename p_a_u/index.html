
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101014">
<meta name="description" content="Quewkyo account transfers">
<title>Quewkyo — Send</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101014;
    color: #ededf0;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
}

main {
    width: 100%;
    max-width: 420px;
}

header {
    margin-bottom: 25px;
}

.brand {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -1.2px;
}

.brand span {
    color: #7199ff;
}

header p {
    color: #777780;
    font-size: 12px;
    margin-top: 6px;
}

.panel {
    background: #19191f;
    border: 1px solid #303038;
    padding: 23px;
    border-radius: 12px;
}

h1 {
    font-size: 19px;
    margin: 0 0 7px;
}

.description {
    color: #85858f;
    font-size: 12px;
    margin-bottom: 25px;
    line-height: 1.5;
}

.field {
    margin-bottom: 17px;
}

label {
    display: block;
    color: #aaaab4;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 8px;
    letter-spacing: .5px;
}

input, select {
    width: 100%;
    height: 44px;
    background: #111115;
    border: 1px solid #363640;
    border-radius: 7px;
    padding: 0 12px;
    color: #eee;
    outline: none;
    font-size: 13px;
}

input:focus, select:focus {
    border-color: #7199ff;
}

input::placeholder {
    color: #62626d;
}

button {
    width: 100%;
    height: 45px;
    background: #6388ed;
    border: none;
    border-radius: 7px;
    color: white;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 4px;
}

button:hover {
    background: #7799f5;
}

button:disabled {
    opacity: .55;
    cursor: wait;
}

#result {
    display: none;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 12px;
    line-height: 1.6;
    padding: 12px;
    margin-top: 17px;
    border-radius: 7px;
}

#result.success {
    display: block;
    background: #14251e;
    border: 1px solid #285d43;
    color: #83d8a9;
}

#result.error {
    display: block;
    background: #29191b;
    border: 1px solid #633237;
    color: #ff969d;
}

#result.info {
    display: block;
    background: #172033;
    border: 1px solid #344c7a;
    color: #a6c2ff;
}

footer {
    text-align: center;
    color: #686873;
    font-size: 10px;
    margin-top: 20px;
}

@media(max-width:400px) {
    .panel {
        padding: 18px;
    }
}
</style>
</head>

<body>

<main>
    <header>
        <div class="brand">QUEWKYO<span>.</span></div>
        <p>ACCOUNT TRANSFER SYSTEM</p>
    </header>

    <section class="panel">
        <h1>Send assets</h1>
        <p class="description">
            Transfer QNK assets to another Quewkyo account.
        </p>

        <form id="transferForm">

            <div class="field">
                <label for="asset">ASSET</label>
                <select id="asset" required>
                    <option value="pay-base">QNK-BASE</option>
                    <option value="pay-unayky">QNK-UNAYKY</option>
                    <option value="pay-bowk">QNK-BOWK</option>
                </select>
            </div>

            <div class="field">
                <label for="sender">YOUR USERNAME</label>
                <input
                    id="sender"
                    type="text"
                    placeholder="Username"
                    autocomplete="username"
                    maxlength="100"
                    required
                >
            </div>

            <div class="field">
                <label for="password">PASSWORD</label>
                <input
                    id="password"
                    type="password"
                    placeholder="Account password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="field">
                <label for="recipient">RECIPIENT</label>
                <input
                    id="recipient"
                    type="text"
                    placeholder="Recipient username"
                    maxlength="100"
                    required
                >
            </div>

            <div class="field">
                <label for="amount">AMOUNT</label>
                <input
                    id="amount"
                    type="number"
                    placeholder="0.00"
                    min="0.000000000000000001"
                    step="any"
                    required
                >
            </div>

            <button id="sendButton" type="submit">
                SEND ASSETS
            </button>

        </form>

        <div id="result" role="status" aria-live="polite"></div>
    </section>

    <footer>
        QUEWKYO · Digital Asset Transfers
    </footer>
</main>

<script>
"use strict";

const API_URL =
    "https://cjccmeaosxnauhzeleuj.supabase.co/functions/v1/paytouser_base";

const form = document.getElementById("transferForm");
const button = document.getElementById("sendButton");
const result = document.getElementById("result");

function showResult(message, type) {
    result.className = type;
    result.textContent = message;
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    console.log("[Quewkyo] Submit event triggered.");

    const payload = {
        action: document.getElementById("asset").value,
        remetente: document.getElementById("sender").value.trim(),
        remetente_password: document.getElementById("password").value,
        destinatario: document.getElementById("recipient").value.trim(),
        value: document.getElementById("amount").value
    };

    if (!payload.remetente ||
        !payload.remetente_password ||
        !payload.destinatario ||
        !payload.value) {
        showResult("Please complete all fields.", "error");
        return;
    }

    if (payload.remetente === payload.destinatario) {
        showResult("You cannot send assets to yourself.", "error");
        return;
    }

    if (!Number.isFinite(Number(payload.value)) ||
        Number(payload.value) <= 0) {
        showResult("Invalid amount.", "error");
        return;
    }

    button.disabled = true;
    button.textContent = "SENDING...";

    showResult("Connecting to Quewkyo API...", "info");

    console.log("[Quewkyo] Sending fetch:", {
        ...payload,
        remetente_password: "[HIDDEN]"
    });

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        console.log("[Quewkyo] HTTP status:", response.status);

        const responseText = await response.text();

        console.log("[Quewkyo] Raw response:", responseText);

        let data;

        try {
            data = JSON.parse(responseText);
        } catch {
            throw new Error(
                "The API did not return valid JSON. HTTP " +
                response.status
            );
        }

        if (!response.ok || !data.success) {
            throw new Error(
                data.erro || "HTTP " + response.status
            );
        }

        showResult(
            "TRANSFER COMPLETED\n\n" +
            "Asset: " + payload.action + "\n" +
            "Sender: " + payload.remetente + "\n" +
            "Recipient: " + payload.destinatario + "\n" +
            "Amount: " + payload.value,
            "success"
        );

        form.reset();

    } catch (error) {
        console.error("[Quewkyo] Fetch error:", error);

        showResult(
            "TRANSFER FAILED\n\n" +
            (error.message || "Unknown error") +
            "\n\nCheck the browser console (F12).",
            "error"
        );

    } finally {
        document.getElementById("password").value = "";
        button.disabled = false;
        button.textContent = "SEND ASSETS";
    }
});

console.log("[Quewkyo] Transfer system initialized.");
</script>

</body>
</html>
