<style>
*{box-sizing:border-box;margin:0;padding:0}

#_q0{width:100%;max-width:460px}
#_q1{text-align:center;margin-bottom:25px}
#_q2{font-size:34px;font-weight:950;letter-spacing:-2px;background:linear-gradient(100deg,var(--a),var(--b));background-clip:text;-webkit-background-clip:text;color:transparent}
#_q3{font-size:10px;color:var(--g);letter-spacing:3px;margin-top:5px}
#_q4{background:linear-gradient(145deg,#151521,#0e0e16);border:1px solid var(--e);border-radius:19px;padding:25px;box-shadow:0 20px 65px #0009}
#_q5{font-size:20px;font-weight:800;margin-bottom:6px}
#_q6{font-size:12px;color:var(--g);margin-bottom:24px}
._q7{margin-bottom:17px}
._q8{display:block;font-size:10px;font-weight:800;color:#aaaabd;letter-spacing:1px;margin-bottom:8px}
._q9{width:100%;height:47px;background:#090910;border:1px solid var(--e);border-radius:10px;padding:0 13px;color:white;font-size:14px;outline:none;transition:.2s}
._q9:focus{border-color:var(--a);box-shadow:0 0 0 3px #438aff19}
._q9::placeholder{color:#55556a}

#_qa{width:100%;height:49px;border:0;border-radius:11px;background:linear-gradient(100deg,#347dff,#a54cff);color:white;font-weight:900;font-size:13px;letter-spacing:1px;cursor:pointer;transition:.2s}

#_qa:disabled{opacity:.5;cursor:wait}
#_qb{display:none;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:16px;padding:13px;border-radius:10px;font-size:12px;line-height:1.7}

#_qb[data-t="2"]{display:block;color:#ff8495;background:#ff526d0b;border:1px solid #ff526d55}
#_qb[data-t="3"]{display:block;color:#8bbaff;background:#438aff0b;border:1px solid #438aff55}
#_qc{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;font-size:10px;color:var(--g)}
#_qd{width:6px;height:6px;border-radius:50%;background:#42d99a;box-shadow:0 0 9px #42d99a}
#_qe{text-align:center;color:#66667a;font-size:10px;line-height:1.9;margin-top:20px}

<header id="_q1">
<div id="_q2">QUEWKYO</div>
<div id="_q3">TRANSFER CENTER</div>

<section id="_q4">
<div id="_q5">Send assets</div>
<div id="_q6">Transfer your digital assets between Quewkyo accounts.</div>

<form id="_qf">
<div class="_q7">
<label class="_q8" for="_qg">ASSET</label>
<select class="_q9" id="_qg" required>

<option value="pay-unayky">QNK-UNAYKY</option>
<option value="pay-bowk">QNK-BOWK</option>
</select>
</div>

<div class="_q7">
<label class="_q8" for="_qh">SENDER</label>
<input class="_q9" id="_qh" type="text" placeholder="Username" autocomplete="username" maxlength="100" required>
</div>

<div class="_q7">
<label class="_q8" for="_qi">PASSWORD</label>
<input class="_q9" id="_qi" type="password" placeholder="Account password" autocomplete="current-password" required>
</div>

<div class="_q7">
<label class="_q8" for="_qj">RECIPIENT</label>
<input class="_q9" id="_qj" type="text" placeholder="Recipient username" maxlength="100" required>
</div>

<div class="_q7">
<label class="_q8" for="_qk">AMOUNT</label>
<input class="_q9" id="_qk" type="number" min="0.000000000000000001" step="any" placeholder="0.00" required>
</div>

<button id="_qa" type="submit">SEND ASSETS</button>
</form>

<div id="_qb" role="status" aria-live="polite"></div>

<div id="_qc"><span id="_qd"></span> QUEWKYO API CONNECTION</div>
</section>

<footer id="_qe">
<strong>QUEWKYO</strong> · Transfer Center<br>
Always verify the recipient before sending.
</footer>
</main>
